<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Colorfly Studio</h1>
    </header>
    <main>
      <aside>
        <section>
          <h2>FORMATO DE COLOR</h2>
          <div>
            <select id="formato-color">
              <option value="hsl">HSL</option>
              <option value="hex">HEX</option>
              <option value="rgba">RGBA</option>
            </select>
          </div>
 
          <div id="cantidad-colores">
            <button data-count="6">6</button>
            <button data-count="8">8</button>
            <button data-count="9">9</button>
          </div>
 
          <div>
            <button id="btn-generar">GENERAR PALETA</button>
            <button id="btn-guardar">GUARDAR PALETA</button>
          </div>
        </section>
      </aside>
 
      <div class="panel-derecho">
        <section class="grid-colores" id="grid-colores">
          <!-- JS genera aquí las tarjetas dinámicamente -->
        </section>
 
        <section class="Historial-de-paletas" id="paletas-guardadas">
          <h3>PALETAS GUARDADAS</h3>
        </section>
      </div>
    </main>
    <script src="./js/script.js"></script>
  </body>
</html>
